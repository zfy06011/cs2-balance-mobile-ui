name: MVP checks and Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'package.json'
      - 'android/**'
      - '.github/workflows/validation.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'package.json'
      - 'android/**'
      - '.github/workflows/validation.yml'

permissions:
  contents: read

jobs:
  data-validation:
    name: Data validation (Node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check module syntax
        run: |
          node --check scripts/core.mjs
          node --check scripts/probe.mjs
          node --check scripts/audit-public.mjs
      - name: Run controlled tests without live market requests
        run: npm test

  android:
    name: Android JVM, Keystore emulator tests, lint and debug APK
    needs: data-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
      - name: Initialize cloud Android SDK and build inputs
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '12266719'
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0'
      - name: Test, lint and build the actual checkout
        run: gradle --project-dir android --no-daemon --console=plain :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Enable emulator acceleration on the cloud runner
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Verify AndroidKeyStore round-trip and Android compression libraries
        run: gradle --project-dir android --no-daemon --console=plain :app:pixel2api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
      - name: Record APK provenance
        env:
          CHECKOUT_REPOSITORY: ${{ github.repository }}
          CHECKOUT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p artifacts/android
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/android/balance-assistant-0.1.2-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging artifacts/android/balance-assistant-0.1.2-debug.apk > artifacts/android/apk-metadata.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess
          apk = pathlib.Path('artifacts/android/balance-assistant-0.1.2-debug.apk')
          badging = pathlib.Path('artifacts/android/apk-metadata.txt').read_text()
          metadata = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          if not metadata or metadata.groups() != ('com.cs2balance.assistant.mvp', '3', '0.1.2'):
              raise RuntimeError('APK identity/version mismatch')
          info = {
              'commitSha': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'repository': os.environ['CHECKOUT_REPOSITORY'],
              'runUrl': os.environ['CHECKOUT_RUN_URL'],
              'package': metadata[1], 'versionName': metadata[3],
              'versionCode': int(metadata[2]), 'variant': 'debug',
              'apk': apk.name, 'sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'deviceVerified': False, 'liveSourcesVerified': False,
              'feeEvidenceSha256': hashlib.sha256(pathlib.Path('android/app/src/main/assets/steam-cny-fee-evidence.json').read_bytes()).hexdigest(),
          }
          pathlib.Path('artifacts/android/build-info.json').write_text(json.dumps(info, indent=2) + '\n')
          PY
      - name: Upload debug APK and source evidence
        uses: actions/upload-artifact@v7
        with:
          name: balance-assistant-0.1.2-debug-${{ github.run_id }}
          path: artifacts/android/
          if-no-files-found: error
          retention-days: 14
      - name: Upload Android checks
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-checks-${{ github.run_id }}
          path: |
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn
          retention-days: 14
